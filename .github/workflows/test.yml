name: QA Automation Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub UI
  repository_dispatch: # Allows spring-ecommerce-app repo to trigger this pipeline automatically
    types: [ecommerce_code_updated]

jobs:
  test:
    name: Run Pytest & Playwright Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout QA Automation Framework code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium & OS dependencies
        run: |
          playwright install chromium --with-deps

      - name: Run Pytest Automation Suite
        run: |
          pytest --html=report.html --self-contained-html -v

      - name: Upload Interactive HTML Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-html-report
          path: report.html
          retention-days: 14
